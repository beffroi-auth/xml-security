# Decision 0014: the three namespaces of the package live in one repository, and the boundary between them is held
# by the tooling. Dsig and Enc depend on Core, never the reverse and never on each other; Core depends on nothing
# of the package. A dependency on a class outside the three layers (the Dom API, PHP itself) is not a violation:
# the calls that section 8 of spec/core.md bans are the business of the PHPStan rules. The paths are relative to
# this file.
deptrac:
  paths:
    - ../src
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\Core\\'
    - name: Dsig
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\Dsig\\'
    - name: Enc
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\Enc\\'
  ruleset:
    Core: ~
    Dsig: [Core]
    Enc: [Core]
