name: CI

on:
  push:
    branches:
      - 'main'
      - '*.*.x'
    tags: ['*']
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Every job with "container:" pulls the phpqa image on a fresh runner before its first step, out of reach of
# actions/cache. The quality checks therefore share one job: one pull and one Composer install instead of one of
# each per tool. The steps run to the end whatever the outcome of the previous ones, so that every tool reports
# its verdict. Each PHP job starts by printing the libxml version and whether LIBXML_NO_XXE is defined, so that
# what the corpus cannot exercise on that build is visible, not hidden (specification, section 12).

jobs:
  pre_checks:
    name: "0️⃣ Pre-checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Check file permissions"
        run: |
          NON_EXECUTABLE=$(find . -type f -not -path './.git/*' -not -name '*.sh' -executable)
          if [[ -n "$NON_EXECUTABLE" ]]; then
            echo "Found non-executable files with executable permission:"
            echo "$NON_EXECUTABLE"
            exit 1
          fi
      - name: "Find non-printable ASCII characters"
        run: |
          if LC_ALL=C.UTF-8 find . -type f -name "*.php" -print0 | xargs -0 grep -PHn "[[:cntrl:]]"; then
            echo "Non-printable ASCII characters found"
            exit 1
          fi

  quality:
    name: "1️⃣ Quality (PHPStan, Mago, Rector, composer.json, syntax)"
    needs: [pre_checks]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
      - id: dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - name: "libxml of this build"
        run: castor libxml
      - name: "Static Analysis (PHPStan)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor phpstan
      - name: "Formatting (Mago)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor mago-format
      - name: "Coding Standards (Mago)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor mago-lint
      - name: "Refactoring (Rector)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor rector
      - name: "Validate composer.json"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor composer-validate
      - name: "Syntax Check"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: castor lint

  tests:
    name: "2️⃣ Tests (PHP ${{ matrix.php-version }})"
    needs: [quality]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:${{ matrix.php-version }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      - name: "libxml of this build"
        run: castor libxml
      - run: castor phpunit
      # The XML coverage and the JUnit report feed the mutation testing job, which does not run the tests again.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-php${{ matrix.php-version }}
          path: .ci-tools/coverage
          retention-days: 1
          if-no-files-found: error

  infection:
    name: "3️⃣ Mutation Testing"
    needs: [tests]
    # Two runs: the files of section 9 whole, with no escaped mutant allowed, on every run; then the lines added
    # or modified over the whole source, a pull request against its base branch, a push against the commit
    # before it.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || endsWith(github.ref, '.x')) && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.5
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base branch and the merge base with it, not the single commit of a shallow clone.
          fetch-depth: 0
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader
      # The coverage of the tests job, same image, same checkout, same paths: Infection reads it as is.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-php8.5
          path: .ci-tools/coverage
      - name: "libxml of this build"
        run: castor libxml
      # Infection counts the two cores of the runner and keeps one for itself; both can run mutants.
      - name: "The files of section 9, no escaped mutant"
        run: castor infect --reuse-coverage --threads=2
      - name: "Mutations of the pull request"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: castor infect --diff --reuse-coverage --base="origin/${{ github.base_ref }}" --threads=2
      - name: "Mutations of the push"
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: castor infect --diff --reuse-coverage --base="${{ github.event.before }}" --threads=2
