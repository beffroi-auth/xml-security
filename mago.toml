# Mago, the Rust toolchain of Carthage Software: the formatter and the linter of this repository.
#
# The file sits at the root, not in .ci-tools, because that is where every editor integration of Mago looks for
# it (the same reason infection.json.dist sits there). The tasks that run it are in .castor/qa.php; the binary
# ships with the phpqa image, so nothing is installed for it. PHPStan (level max, .ci-tools/phpstan.neon) stays
# the static analysis the CI gates on; the analyzer of Mago is not wired in.

# The version the phpqa image carries (/tools/mago). A binary of another version warns about the drift instead
# of silently formatting differently. Raise this the day the image is rebuilt on a newer Mago, and reformat in
# the same commit.
version = "1.50"
php-version = "8.4"

[source]
paths = ["src", "tests", "castor.php", ".castor", ".ci-tools/rector.php"]
# Read, never reported on: what the analyzer needs to resolve a symbol. The second path is where the phpqa image
# keeps PHPUnit; it simply does not exist outside the image, which is where the quality tasks run.
includes = ["vendor", "/tools/.composer/vendor-bin/phpunit/vendor"]

# ---------------------------------------------------------------------------------------------------
# The formatter. Every option below is a departure from Mago's default, chosen so that the formatter writes
# the style of the maintainer's other libraries.
# ---------------------------------------------------------------------------------------------------
[formatter]
end-of-line = "lf"
print-width = 120

# `use` statements: sorting is left to the author, Mago groups by kind and cannot interleave.
sort-uses = "preserve"
separate-use-types = false

# `! $x`, `fn ($x)`: the spacing of the maintainer's other libraries.
space-after-logical-not-unary-prefix-operator = true
space-before-arrow-function-parameter-list-parenthesis = true

# An empty body stays `{` and `}` on two lines, as PSR-12 writes it, not `{}`.
inline-empty-constructor-braces = false
inline-empty-method-braces = false
inline-empty-function-braces = false
inline-empty-closure-braces = false
inline-empty-classlike-braces = false
inline-empty-anonymous-class-braces = false

# A break the author wrote in a list is a break the formatter keeps. The binary-expression and member-access
# variants stay off: measured on the maintainer's other repository, they make the formatter's output unstable.
preserve-breaking-argument-list = true
inline-single-breaking-value-argument = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
first-method-chain-on-new-line = false

# ---------------------------------------------------------------------------------------------------
# The linter. A rule disabled below is disabled because the repository deliberately writes what it forbids.
# ---------------------------------------------------------------------------------------------------
[linter]
integrations = ["phpunit"]
minimum-fail-level = "note"

[linter.rules]

# `getenv('X') ?: $default` is how the castor tasks read their environment; the rule stands elsewhere.
no-shorthand-ternary = { exclude = ["castor.php", ".castor/**"] }

# The castor tasks take boolean options (--diff, --all, --reuse-coverage); the rule stands in src/ and tests/.
no-boolean-flag-parameter = { exclude = ["castor.php", ".castor/**"] }

# A literal argument does not become a named argument: `new Name(null, 'ID')` reads as the specification writes it.
literal-named-argument = { enabled = false }

# The maintainer's test form: a test that measures the state left after a failure swallows the exception with an
# empty catch.
no-empty-catch-clause = { enabled = false }

# The brick holds no secret: the rule fired on the `$token` of the source guard test, a token of PHP source.
sensitive-parameter = { enabled = false }

# ---------------------------------------------------------------------------------------------------
# The analyzer: not wired into the CI, PHPStan stays. `mago analyze` runs it by hand; read the report before
# trusting it. Neither castor nor its tasks are in vendor: the analyzer cannot resolve a single one of their calls.
# ---------------------------------------------------------------------------------------------------
[analyzer]
excludes = ["castor.php", ".castor", ".ci-tools/rector.php"]
